name: Build Android APK

on:
  push:
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      app_folder:
        description: 'App folder name under apps/ (e.g. 2026-08-07-FocusTimer)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find app to build
        id: find_app
        run: |
          if [ -n "${{ github.event.inputs.app_folder }}" ]; then
            APP_PATH="apps/${{ github.event.inputs.app_folder }}"
          else
            # Build the most recently modified app folder
            APP_PATH=$(find apps -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Building: $APP_PATH"

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.find_app.outputs.app_path }}
        run: chmod +x gradlew || true

      - name: Build Debug APK
        working-directory: ${{ steps.find_app.outputs.app_path }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew found. Creating minimal structure..."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_app.outputs.app_path }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
